services:
  web:
    build: .
    container_name: andalas_web
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env.docker
    depends_on:
      - db
      - redis

  db:
    image: postgres:16
    container_name: andalas_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: andalas_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    container_name: andalas_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  postgres_data:
